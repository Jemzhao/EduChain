name: educhain

services:
  mysql:
    image: mysql:8.4.11
    environment:
      MYSQL_DATABASE: educhain
      MYSQL_PASSWORD: educhain_local
      MYSQL_ROOT_PASSWORD: educhain_root_local
      MYSQL_USER: educhain
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -ueduchain -peduchain_local --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:8.2.1
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis-data:/data

  evidence-gateway:
    build:
      context: ./apps/evidence-gateway
    environment:
      EDUCHAIN_EVIDENCE_MODE: simulator
      EDUCHAIN_EVIDENCE_DEPLOYMENT_ENVIRONMENT: local
      EDUCHAIN_EVIDENCE_DATA_PATH: /app/data/evidence-simulator.sqlite3
      EDUCHAIN_EVIDENCE_INTERNAL_SERVICE_TOKEN: local-evidence-service-token-at-least-32-characters
      EDUCHAIN_EVIDENCE_PUBLIC_BASE_URL: http://localhost:3000
      EDUCHAIN_EVIDENCE_CERTIFICATE_STORAGE_PATH: /app/data/certificates
    ports:
      - "8081:8081"
    volumes:
      - evidence-data:/app/data

  server:
    build:
      context: ./apps/server
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      evidence-gateway:
        condition: service_started
    environment:
      EDUCHAIN_DEPLOYMENT_ENVIRONMENT: LOCAL
      EDUCHAIN_DB_HOST: mysql
      EDUCHAIN_DB_PASSWORD: educhain_local
      EDUCHAIN_REDIS_HOST: redis
      EDUCHAIN_SESSION_SECRET: local-session-secret-at-least-32-characters
      EDUCHAIN_SECURE_COOKIES: "false"
      EDUCHAIN_CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      EDUCHAIN_EVIDENCE_GATEWAY_URL: http://evidence-gateway:8081
      EDUCHAIN_EVIDENCE_SERVICE_TOKEN: local-evidence-service-token-at-least-32-characters
      EDUCHAIN_EVIDENCE_AUTHOR_SECRET: local-author-secret-at-least-32-characters
      EDUCHAIN_EVIDENCE_BACKEND: SIMULATOR
      EDUCHAIN_FILE_ROOT: /app/var/files
      EDUCHAIN_LOCAL_BOOTSTRAP_ENABLED: "true"
      EDUCHAIN_LOCAL_ADMIN_EMAIL: demo@educhain.local
      EDUCHAIN_LOCAL_ADMIN_HANDLE: demo_admin
      EDUCHAIN_LOCAL_ADMIN_DISPLAY_NAME: EduChain 管理员
      EDUCHAIN_LOCAL_ADMIN_PASSWORD: Trustworthy!Demo
    ports:
      - "8080:8080"
    volumes:
      - server-files:/app/var/files

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_MODE: remote
        EDUCHAIN_DEPLOYMENT_ENV: integration
        EDUCHAIN_SERVER_URL: http://server:8080
    depends_on:
      server:
        condition: service_started
    ports:
      - "3000:3000"

volumes:
  mysql-data:
  redis-data:
  evidence-data:
  server-files:
