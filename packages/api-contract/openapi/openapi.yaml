openapi: 3.1.0
info:
  title: EduChain API
  version: 1.0.0
  license:
    name: Private project
    identifier: LicenseRef-Private
  description: |
    EduChain Web 与 Java Server 共享的公开 HTTP 契约。
    所有用户可见文案由 Web 的 Intlayer 内容字典负责，服务端只返回稳定错误代码和安全参数。
servers:
  - url: /api/v1
    description: Same-origin API
tags:
  - name: System
    description: Public service capability and availability.
  - name: Authentication
    description: Registration, authentication and session lifecycle.
  - name: Users
    description: Private account data and public creator profiles.
  - name: Knowledge
    description: Drafts, immutable publications and public knowledge resources.
  - name: Taxonomy
    description: Governed categories and tags used by publishing and discovery.
  - name: Files
    description: Controlled upload sessions and safe file metadata.
  - name: Search
    description: Explainable discovery across published knowledge resources.
  - name: Discovery
    description: Public engagement statistics, history and recommendations.
  - name: Interactions
    description: Likes, collections and bounded resource discussions.
  - name: Social
    description: Follow relationships between active users.
  - name: Notifications
    description: Private in-app notifications, read state and preferences.
  - name: Community
    description: Public community signals, topics, creators and publication feed.
  - name: Achievements
    description: Deterministic contribution progress, levels and contributor rankings.
  - name: Evidence
    description: Evidence state, public proof, verification and certificate access.
  - name: Support
    description: Authenticated support cases and bounded staff conversations.
  - name: External Content
    description: Curated educational references fetched from explicitly governed sources.
  - name: Administration
    description: Explicit, audited governance endpoints for authorized operators.
paths:
  /health:
    get:
      operationId: getHealth
      tags: [System]
      summary: Read public service health
      security: []
      responses:
        "200":
          description: Service is available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
  /auth/registrations:
    post:
      operationId: registerAccount
      tags: [Authentication]
      summary: Register an account and start a session
      security: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationRequest"
      responses:
        "201":
          description: Account created
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedUserResponse"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
  /auth/csrf-token:
    get:
      operationId: getCsrfToken
      tags: [Authentication]
      summary: Issue the browser CSRF token used by state-changing requests
      security: []
      responses:
        "200":
          description: CSRF token issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfTokenResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
  /auth/sessions:
    post:
      operationId: createSession
      tags: [Authentication]
      summary: Authenticate and start a session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedUserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
    get:
      operationId: listSessions
      tags: [Authentication]
      summary: List active sessions for the current account
      responses:
        "200":
          description: Active sessions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/SessionSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/sessions/current:
    get:
      operationId: getCurrentSession
      tags: [Authentication]
      summary: Read the current browser session without treating anonymity as an error
      security: []
      responses:
        "200":
          description: Current authenticated account
          headers:
            Cache-Control:
              schema:
                type: string
              description: Private session data must not be stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserResponse"
        "204":
          description: No authenticated browser session
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      operationId: deleteCurrentSession
      tags: [Authentication]
      summary: Revoke the current session
      responses:
        "204":
          description: Session revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/sessions/{sessionId}:
    delete:
      operationId: deleteSession
      tags: [Authentication]
      summary: Revoke one session owned by the current account
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Session revoked or already inactive
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /auth/token-refreshes:
    post:
      operationId: refreshSession
      tags: [Authentication]
      summary: Rotate the refresh token and issue a new access session
      responses:
        "204":
          description: Session refreshed
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/password-reset-requests:
    post:
      operationId: requestPasswordReset
      tags: [Authentication]
      summary: Request a one-time password reset without account enumeration
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
      responses:
        "202":
          description: Request accepted whether or not the account exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetRequestResponse"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
  /auth/password-resets:
    post:
      operationId: completePasswordReset
      tags: [Authentication]
      summary: Consume a one-time credential and replace the account password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetCompletionRequest"
      responses:
        "204":
          description: Password replaced and all sessions revoked
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
  /auth/password-changes:
    post:
      operationId: changePassword
      tags: [Authentication]
      summary: Verify the current password and replace it
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChangeRequest"
      responses:
        "204":
          description: Password replaced and all sessions revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
  /users/me:
    get:
      operationId: getCurrentUser
      tags: [Users]
      summary: Read the current account and private profile
      responses:
        "200":
          description: Current account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      operationId: updateCurrentUser
      tags: [Users]
      summary: Update the current profile
      parameters:
        - $ref: "#/components/parameters/ExpectedVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /users/me/resources:
    get:
      operationId: listMyResources
      tags: [Knowledge]
      summary: List the current creator's drafts and published resources
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ResourceStatus"
      responses:
        "200":
          description: Creator resource workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyResourceListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /users/me/history:
    get:
      operationId: getBrowsingHistory
      tags: [Discovery]
      summary: Read the current user's recent resource history
      parameters:
        - $ref: "#/components/parameters/PageLimit"
      responses:
        "200":
          description: Recent unique resource views
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowsingHistoryResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      operationId: clearBrowsingHistory
      tags: [Discovery]
      summary: Clear the current user's browsing history
      responses:
        "204":
          description: History cleared
        "401":
          $ref: "#/components/responses/Unauthorized"
  /users/me/search-history:
    get:
      operationId: listSearchHistory
      tags: [Search]
      summary: List the current account's recent non-empty search queries
      parameters:
        - $ref: "#/components/parameters/PageLimit"
      responses:
        "200":
          description: Recent search history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchHistoryResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      operationId: clearSearchHistory
      tags: [Search]
      summary: Permanently clear the current account's search history
      responses:
        "204":
          description: Search history cleared
        "401":
          $ref: "#/components/responses/Unauthorized"
  /users/me/search-history/{historyId}:
    delete:
      operationId: deleteSearchHistoryItem
      tags: [Search]
      summary: Permanently remove one search history item owned by the current account
      parameters:
        - name: historyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Search history item removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /users/me/activity:
    get:
      operationId: listMyActivity
      tags: [Discovery]
      summary: List recent user activity events
      parameters:
        - $ref: "#/components/parameters/PageLimit"
      responses:
        "200":
          description: Recent user activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /users/{handle}:
    get:
      operationId: getPublicUser
      tags: [Users]
      summary: Read a public creator profile
      security: []
      parameters:
        - name: handle
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UserHandle"
      responses:
        "200":
          description: Public profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicUserResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /resources:
    get:
      operationId: listResources
      tags: [Knowledge]
      summary: List public knowledge resources
      security: []
      parameters:
        - $ref: "#/components/parameters/PageCursor"
        - $ref: "#/components/parameters/PageLimit"
        - name: category
          in: query
          schema:
            type: string
        - name: tag
          in: query
          schema:
            type: string
        - name: sort
          in: query
          schema:
            $ref: "#/components/schemas/ResourceSort"
      responses:
        "200":
          description: Published resources
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceListResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      operationId: createResourceDraft
      tags: [Knowledge]
      summary: Create a private knowledge resource draft
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateResourceDraftRequest"
      responses:
        "201":
          description: Draft created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceDraftResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /resources/{resourceKey}:
    get:
      operationId: getResource
      tags: [Knowledge]
      summary: Read a public knowledge resource by UUID or slug
      security: []
      parameters:
        - $ref: "#/components/parameters/ResourceKey"
      responses:
        "200":
          description: Published resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceDetailResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          description: The resource is withdrawn but its evidence remains traceable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /resources/{resourceId}/draft:
    get:
      operationId: getResourceDraft
      tags: [Knowledge]
      summary: Read an owned resource draft
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Editable draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceDraftResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateResourceDraft
      tags: [Knowledge]
      summary: Save an owned resource draft with optimistic concurrency
      parameters:
        - $ref: "#/components/parameters/ResourceId"
        - $ref: "#/components/parameters/ExpectedVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateResourceDraftRequest"
      responses:
        "200":
          description: Saved draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceDraftResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /resources/{resourceId}/publications:
    post:
      operationId: publishResource
      tags: [Knowledge]
      summary: Publish an immutable version from the current draft
      parameters:
        - $ref: "#/components/parameters/ResourceId"
        - $ref: "#/components/parameters/ExpectedVersion"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: Version published and downstream processing accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /resources/{resourceId}/versions:
    get:
      operationId: listResourceVersions
      tags: [Knowledge]
      summary: List immutable published versions of a visible resource
      security: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Published version history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceVersionListResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /resources/{resourceId}/draft-restorations:
    post:
      operationId: restoreResourceVersionToDraft
      tags: [Knowledge]
      summary: Replace the owned editable draft with a published version snapshot
      parameters:
        - $ref: "#/components/parameters/ResourceId"
        - $ref: "#/components/parameters/ExpectedVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestoreResourceVersionRequest"
      responses:
        "200":
          description: Restored editable draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceDraftResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /resources/{resourceId}/withdrawals:
    post:
      operationId: withdrawOwnResource
      tags: [Knowledge]
      summary: Withdraw an owned published resource while preserving its evidence
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GovernanceReasonRequest"
      responses:
        "200":
          description: Resource withdrawn from public discovery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyResourceSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /resources/{resourceId}/restorations:
    post:
      operationId: restoreOwnResource
      tags: [Knowledge]
      summary: Restore an owned withdrawn resource to its unchanged public version
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GovernanceReasonRequest"
      responses:
        "200":
          description: Resource restored to public discovery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyResourceSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /resources/{resourceId}/views:
    post:
      operationId: recordResourceView
      tags: [Discovery]
      summary: Idempotently record a pseudonymous resource view
      security: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordResourceViewRequest"
      responses:
        "200":
          description: View recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceViewResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /resources/{resourceId}/statistics:
    get:
      operationId: getResourceStatistics
      tags: [Discovery]
      summary: Read public resource engagement statistics
      security: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Public resource statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceStatisticsResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /recommendations/resources:
    get:
      operationId: listRecommendedResources
      tags: [Discovery]
      summary: List privacy-conscious resource recommendations
      security: []
      parameters:
        - $ref: "#/components/parameters/PageLimit"
      responses:
        "200":
          description: Recommended resources
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceListResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
  /resources/{resourceId}/like:
    get:
      operationId: getResourceLikeState
      tags: [Interactions]
      summary: Read the current user's like state and the derived resource count
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Current like state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LikeStateResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    put:
      operationId: setResourceLikeState
      tags: [Interactions]
      summary: Idempotently set the current user's like state
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LikeStateRequest"
      responses:
        "200":
          description: Target like state applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LikeStateResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /recommendations/resources/{resourceId}/feedback:
    put:
      operationId: dismissResourceRecommendation
      tags: [Discovery]
      summary: Idempotently dismiss a recommendation for the current account
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Recommendation feedback stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecommendationFeedbackResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /resources/{resourceId}/comments:
    get:
      operationId: listResourceComments
      tags: [Interactions]
      summary: Read visible comment threads for a public resource
      security: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
        - $ref: "#/components/parameters/PageCursor"
        - $ref: "#/components/parameters/PageLimit"
      responses:
        "200":
          description: Stable root comments with bounded replies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentThreadListResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    post:
      operationId: createResourceComment
      tags: [Interactions]
      summary: Create a root comment or one-level reply
      parameters:
        - $ref: "#/components/parameters/ResourceId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommentRequest"
      responses:
        "201":
          description: Comment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /comments/{commentId}:
    delete:
      operationId: deleteOwnComment
      tags: [Interactions]
      summary: Soft-delete a comment while preserving thread structure
      parameters:
        - $ref: "#/components/parameters/CommentId"
      responses:
        "200":
          description: Deleted comment placeholder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
