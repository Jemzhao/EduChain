          format: uuid
        versionNumber:
          type: integer
          minimum: 1
        title:
          type: string
        summary:
          type: string
        contentDigest:
          type: string
          pattern: "^[a-f0-9]{64}$"
        publishedAt:
          type: string
          format: date-time
        current:
          type: boolean
    ResourceVersionListResponse:
      type: object
      additionalProperties: false
      required: [resourceId, items]
      properties:
        resourceId:
          type: string
          format: uuid
        items:
          type: array
          items:
            $ref: "#/components/schemas/ResourceVersionSummary"
    RestoreResourceVersionRequest:
      type: object
      additionalProperties: false
      required: [versionId]
      properties:
        versionId:
          type: string
          format: uuid
    RecordResourceViewRequest:
      type: object
      additionalProperties: false
      required: [viewerKey]
      properties:
        viewerKey:
          type: string
          minLength: 16
          maxLength: 128
    ResourceViewResponse:
      type: object
      additionalProperties: false
      required: [resourceId, viewCount]
      properties:
        resourceId:
          type: string
          format: uuid
        viewCount:
          type: integer
          format: int64
          minimum: 0
    ResourceStatisticsResponse:
      type: object
      additionalProperties: false
      required: [resourceId, views, likes, saves, comments]
      properties:
        resourceId:
          type: string
          format: uuid
        views:
          type: integer
          format: int64
          minimum: 0
        likes:
          type: integer
          format: int64
          minimum: 0
        saves:
          type: integer
          format: int64
          minimum: 0
        comments:
          type: integer
          format: int64
          minimum: 0
    BrowsingHistoryItem:
