        resourceId:
          type: string
          format: uuid
        slug:
          type: string
        status:
          $ref: "#/components/schemas/ResourceStatus"
        resourceVersion:
          type: integer
          format: int64
          minimum: 0
        draftVersion:
          type: integer
          format: int64
          minimum: 0
        title:
          type: string
        summary:
          type: string
        body:
          type: string
        resourceType:
          $ref: "#/components/schemas/ResourceType"
        sourceUrl:
          type: string
        categoryId:
          type: [string, "null"]
          format: uuid
        tagIds:
          type: array
          items:
            type: string
            format: uuid
        coverFileId:
          type: [string, "null"]
          format: uuid
        attachments:
          type: array
