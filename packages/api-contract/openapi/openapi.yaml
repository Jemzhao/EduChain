components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: educhain_session
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Stable key for safely repeating a write request.
      schema:
        type: string
        minLength: 16
        maxLength: 128
    ExpectedVersion:
      name: If-Match
      in: header
      required: true
      description: Quoted optimistic concurrency version.
      schema:
        type: string
        pattern: '^"[0-9]+"$'
    ResourceId:
      name: resourceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProofId:
      name: proofId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CommentId:
      name: commentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CollectionId:
      name: collectionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SupportTicketId:
      name: ticketId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ExternalSourceId:
      name: sourceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ExternalItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ResourceKey:
      name: resourceKey
      in: path
      required: true
      schema:
        type: string
        minLength: 3
        maxLength: 120
    UploadId:
      name: uploadId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FileId:
      name: fileId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PageCursor:
      name: cursor
      in: query
      schema:
        type: string
        maxLength: 200
    PageLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
  headers:
    RequestId:
      description: Public identifier used to correlate a request.
      schema:
        type: string
  responses:
    BadRequest:
      description: The request credential or syntax is invalid
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Authentication is required or no longer valid
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: The authenticated account cannot perform this operation
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: The requested object does not exist or is not visible
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: The request conflicts with current state or uniqueness rules
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ValidationFailed:
      description: One or more fields are invalid
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    RateLimited:
      description: Too many requests
      headers:
        Retry-After:
          description: Suggested retry delay in seconds.
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PayloadTooLarge:
      description: The declared or transferred file exceeds the allowed size
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnsupportedMediaType:
      description: The declared or detected media type is not allowed
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ServiceUnavailable:
      description: A required service is temporarily unavailable
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, service]
      properties:
        status:
          type: string
          const: available
        service:
          type: string
          const: educhain-server
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code, instance, requestId, retryable]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          pattern: "^[A-Z][A-Z0-9_]+$"
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        requestId:
          type: string
        retryable:
          type: boolean
        parameters:
          type: object
          additionalProperties:
            type: string
        fieldErrors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
    FieldError:
      type: object
      additionalProperties: false
      required: [field, code]
      properties:
        field:
          type: string
        code:
          type: string
          pattern: "^[A-Z][A-Z0-9_]+$"
        parameters:
          type: object
          additionalProperties:
            type: string
    RegistrationRequest:
      type: object
      additionalProperties: false
      required: [email, handle, password, displayName]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        handle:
          $ref: "#/components/schemas/UserHandle"
        password:
          type: string
          minLength: 12
          maxLength: 128
        displayName:
          type: string
          minLength: 1
          maxLength: 80
    LoginRequest:
      type: object
      additionalProperties: false
      required: [identifier, password]
      properties:
        identifier:
          type: string
          minLength: 1
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 128
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
    PasswordResetRequestResponse:
      type: object
      additionalProperties: false
      required: [accepted]
      properties:
        accepted:
          type: boolean
          const: true
        previewToken:
          type: [string, "null"]
          description: Local-mode convenience only; always absent outside the local environment
    PasswordResetCompletionRequest:
      type: object
      additionalProperties: false
      required: [token, newPassword]
      properties:
        token:
          type: string
          minLength: 32
          maxLength: 256
        newPassword:
          type: string
          minLength: 12
          maxLength: 128
    PasswordChangeRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 128
        newPassword:
          type: string
          minLength: 12
          maxLength: 128
    CsrfTokenResponse:
      type: object
      additionalProperties: false
      required: [token, headerName]
      properties:
        token:
          type: string
          minLength: 16
        headerName:
          type: string
          const: X-XSRF-TOKEN
    UpdateProfileRequest:
      type: object
      additionalProperties: false
      required: [displayName, bio, education, avatarFileId, location, websiteUrl, contactEmail]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        bio:
          type: string
          maxLength: 500
        education:
          type: string
          maxLength: 160
        avatarFileId:
          type: [string, "null"]
          format: uuid
        location:
          type: string
          maxLength: 120
        websiteUrl:
          type: string
          maxLength: 300
          pattern: "^$|https://.+"
        contactEmail:
          type: string
          maxLength: 254
    UserHandle:
      type: string
      minLength: 3
      maxLength: 32
      pattern: "^[a-z][a-z0-9_-]*$"
    UserStatus:
      type: string
      enum: [ACTIVE, RESTRICTED, DISABLED]
    UserSummary:
      type: object
      additionalProperties: false
      required: [id, handle, displayName, status, version]
      properties:
        id:
          type: string
          format: uuid
        handle:
          $ref: "#/components/schemas/UserHandle"
        displayName:
          type: string
        avatarUrl:
          type: [string, "null"]
          format: uri
        status:
          $ref: "#/components/schemas/UserStatus"
        version:
          type: integer
          format: int64
          minimum: 0
    AuthenticatedUserResponse:
      type: object
      additionalProperties: false
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/UserSummary"
    CurrentUserResponse:
      type: object
      additionalProperties: false
      required: [user, email, roles, profile]
      properties:
        user:
          $ref: "#/components/schemas/UserSummary"
        email:
          type: string
          format: email
        roles:
          type: array
          items:
            type: string
            enum: [USER, MODERATOR, ADMINISTRATOR]
        profile:
          $ref: "#/components/schemas/ProfileDetails"
    PublicUserResponse:
      type: object
      additionalProperties: false
      required: [user, profile, statistics]
      properties:
        user:
          $ref: "#/components/schemas/UserSummary"
        profile:
          $ref: "#/components/schemas/ProfileDetails"
        statistics:
          $ref: "#/components/schemas/PublicUserStatistics"
    ProfileDetails:
      type: object
      additionalProperties: false
      required: [bio, education, location, websiteUrl, contactEmail]
      properties:
        bio:
          type: string
        education:
          type: string
        location:
          type: string
        websiteUrl:
          type: string
        contactEmail:
          type: string
    PublicUserStatistics:
      type: object
      additionalProperties: false
      required: [publishedResources, followers, following]
      properties:
        publishedResources:
          type: integer
          minimum: 0
        followers:
          type: integer
          minimum: 0
        following:
          type: integer
          minimum: 0
    SessionSummary:
      type: object
      additionalProperties: false
      required: [id, current, createdAt, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        current:
          type: boolean
        deviceLabel:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    ResourceStatus:
      type: string
      enum: [DRAFT, PUBLISHED, WITHDRAWN]
    ResourceType:
      type: string
      enum: [ARTICLE, DOCUMENT, VIDEO, LINK]
    ResourceSort:
      type: string
      enum: [RELEVANCE, NEWEST, QUALITY, POPULAR]
      default: RELEVANCE
    FileStatus:
      type: string
      enum: [CREATED, UPLOADING, SCANNING, AVAILABLE, REJECTED, EXPIRED]
    UploadPurpose:
      type: string
      enum: [RESOURCE_ATTACHMENT, RESOURCE_COVER, AVATAR, VERIFICATION]
    EvidenceProcessingStatus:
      type: string
      enum: [NOT_REQUESTED, PENDING, PROCESSING, CONFIRMED, FAILED, TERMINATED]
    PageInfo:
      type: object
      additionalProperties: false
      required: [nextCursor, hasMore]
      properties:
        nextCursor:
          type: [string, "null"]
        hasMore:
          type: boolean
    CategoryResponse:
      type: object
      additionalProperties: false
      required: [id, slug, nameKey, descriptionKey, order, children]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        nameKey:
          type: string
        descriptionKey:
          type: string
        order:
          type: integer
        children:
          type: array
          items:
            $ref: "#/components/schemas/CategoryResponse"
    TagResponse:
      type: object
