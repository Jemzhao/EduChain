        resource:
          $ref: "#/components/schemas/ResourceCard"
        viewedAt:
          type: string
          format: date-time
    BrowsingHistoryResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/BrowsingHistoryItem"
    ActivityType:
      type: string
      enum:
        [VIEWED_RESOURCE, LIKED_RESOURCE, SAVED_RESOURCE, COMMENTED_RESOURCE, PUBLISHED_RESOURCE]
    ActivityItem:
