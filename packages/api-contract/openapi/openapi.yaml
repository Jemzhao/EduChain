        resourceId:
          type: string
          format: uuid
        slug:
          type: string
        status:
          $ref: "#/components/schemas/ResourceStatus"
        resourceType:
          $ref: "#/components/schemas/ResourceType"
        title:
          type: string
        summary:
          type: string
        draftVersion:
          type: integer
          format: int64
          minimum: 0
        savedAt:
          type: string
          format: date-time
        publishedAt:
          type: [string, "null"]
          format: date-time
        publicVersionNumber:
          type: [integer, "null"]
