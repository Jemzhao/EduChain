          type: string
          maxLength: 160
        summary:
          type: string
          maxLength: 600
        body:
          type: string
          maxLength: 100000
        sourceUrl:
          type: string
          maxLength: 2048
        categoryId:
          type: [string, "null"]
          format: uuid
        tagIds:
          type: array
          maxItems: 8
          uniqueItems: true
          items:
            type: string
            format: uuid
        coverFileId:
          type: [string, "null"]
          format: uuid
        attachments:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/DraftAttachment"
        copyrightStatement:
          type: string
          maxLength: 500
    ResourceDraftResponse:
      type: object
      additionalProperties: false
      required:
        [
          resourceId,
          slug,
          status,
          resourceVersion,
          draftVersion,
          title,
          summary,
          body,
          resourceType,
          sourceUrl,
          categoryId,
          tagIds,
          coverFileId,
          attachments,
          copyrightStatement,
          savedAt,
        ]
