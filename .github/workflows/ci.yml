name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-and-contract:
    name: Web and contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting and architecture
        run: |
          pnpm format:check
          pnpm structure:check

      - name: Validate and regenerate OpenAPI types
        run: |
          pnpm contract:validate
          pnpm contract:generate
          git diff --exit-code -- packages/api-contract/src/generated/schema.ts

      - name: Check Web types and lint
        run: |
          pnpm --filter @educhain/web typecheck
          pnpm --filter @educhain/web lint

      - name: Build Remote Web
        env:
          NEXT_PUBLIC_API_MODE: remote
          NEXT_PUBLIC_API_BASE_URL: /api/v1
          EDUCHAIN_DEPLOYMENT_ENV: integration
          EDUCHAIN_SERVER_URL: http://server:8080
        run: pnpm --filter @educhain/web build

  java-server:
    name: Java Server
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/server
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: apps/server/pom.xml

      - name: Verify Java Server
        run: ./mvnw --batch-mode --no-transfer-progress verify

  evidence-gateway:
    name: Evidence Gateway
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/evidence-gateway
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/evidence-gateway/pyproject.toml

      - name: Install gateway and development tools
        run: python -m pip install -e '.[dev]'

      - name: Check formatting, lint and types
        run: |
          ruff check src tests
          ruff format --check src tests
          mypy src

      - name: Run gateway tests
        run: pytest
