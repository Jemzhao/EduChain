name: Feature request
description: 提议可验证的产品或工程改进
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与问题
      description: 谁在什么情况下遇到了什么问题？
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: 期望结果
      description: 描述可观察的结果，而不是只描述实现方式。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 可包含页面、接口、权限、数据、错误状态和兼容性影响。

  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我已检查产品与架构文档，提议不与现有边界明显冲突。
          required: true
        - label: 我已搜索现有 Issue，未发现相同建议。
          required: true
